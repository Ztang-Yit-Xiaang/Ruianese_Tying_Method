schema:
  schema_id: ruian_pinyin
  name: 瑞安話拼音
  version: "1.0"

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor

  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor

  translators:
    - punct_translator
    - table_translator

  filters:
    - uniquifier

translator:
  dictionary: ruian_pinyin
  enable_completion: true
  enable_sentence: true

speller:
  alphabet: abcdefghijklmnopqrstuvwxyz
  delimiter: " '"

recognizer:
  patterns:
    punct: "^/([a-z]+)$"