# Rime schema for Rui'an dialect (Romanization-based)
# 瑞安話拼音輸入方案（基於字典轉寫規則）

schema:
  schema_id: ruian_pinyin
  name: 瑞安話拼音
  version: "1.0"
  author:
    - Generated by ChatGPT
  description: |
    瑞安話輸入方案，基於拉丁化拼音。
    核心規則：
      - o → o，ɔ → oe
      - æ → ae，ʉ / y̟u → yu
      - uɔ → uoe，yɔ → yoe
      - ts → z，tsʰ → c，dz → zz
      - 聲調以 1–8 表示；入聲不強制輸入 -p/-t/-k 韻尾

alphabet:
  # 聲母（清 / 送氣 / 濁三分）
  initials:
    - b    # p
    - p    # pʰ
    - bb   # b
    - m
    - f
    - v
    - d    # t
    - t    # tʰ
    - dd   # d
    - n
    - l
    - g    # k
    - k    # kʰ
    - gg   # g
    - ng   # ŋ
    - h
    - hh   # ɦ
    - j    # tɕ
    - q    # tɕʰ
    - jj   # dʑ
    - nj   # ȵ
    - x    # ɕ
    - z    # ts（拼寫層合併）
    - c    # tsʰ
    - zz   # dz
    - s
    - zs   # ʑ / z̠

  # 韻母（單韻母 + 複韻母 + 鼻韻母 + 特殊韻母）
  finals:
    # 單韻母
    - a
    - o     # o
    - oe    # ɔ
    - ae    # æ
    - e
    - i
    - u
    - yu    # ʉ / y̟u

    # 複韻母
    - ao
    - ai
    - ou
    - ei
    - ia
    - iao
    - iou
    - ie
    - iae
    - io
    - uai
    - uo
    - uoe
    - yo
    - yue
    - yoe

    # 鼻韻母
    - ang
    - eng
    - ong
    - iang
    - iong

    # 特殊韻母
    - ng

# 聲調（數字調，與轉寫規則一致）
# 陰平 1｜陰上 2｜陰去 3｜陰入 4
# 陽平 5｜陽上 6｜陽去 7｜陽入 8
tone_marks:
  - ""
  - "1"
  - "2"
  - "3"
  - "4"
  - "5"
  - "6"
  - "7"
  - "8"

# 音節拼合規則：聲母 + 韻母 + 聲調
speller:
  alphabet: "abcdefghijklmnopqrstuvwxyz12345678"
  delimiter: " "

translator:
  dictionary: ruian_pinyin
  prism: ruian_pinyin

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - table_translator
  filters:
    - uniquifier
